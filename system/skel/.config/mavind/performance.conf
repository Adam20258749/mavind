# Mavind Performance Mode. Managed by Mavind Settings > Display, but plain text.
# enabled = false  -> normal desktop (effects already minimal)
# enabled = true   -> disable shadows, solid wallpaper, cairo renderer, slower tick
enabled = false

[effects]
server_side_shadows = true
wallpaper = image          # image | solid
gtk_renderer = gl          # gl | ngl | cairo

[shell]
tick_seconds = 1
show_taskbar_icons = true

[minder]
thumbnails = true
