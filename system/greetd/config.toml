# greetd — the login manager for an INSTALLED Mavind system.
# The live ISO bypasses this with tty1 autologin (see getty-autologin.conf).
#
# agety is greetd's built-in text greeter (zero extra deps). Swap `command`
# for `gtkgreet -l -c mavind-session` once gtkgreet is packaged in Mavind.

[terminal]
vt = 1

[default_session]
command = "agreety --cmd /usr/bin/mavind-session"
user = "greeter"
