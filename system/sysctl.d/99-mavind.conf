# Mavind low-RAM tuning (docs/RAM-BUDGET.md). Paired with zram swap.

# Prefer reclaiming/compressing cold anon pages into zram over evicting cache.
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Small machines: don't overcommit wildly, but allow Wine's large sparse maps.
vm.overcommit_memory = 1

# Responsiveness on spinning disks / slow eMMC.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Desktop-friendly OOM: kill the worst cgroup, not random tasks.
vm.oom_kill_allocating_task = 0

# Network: modest buffers, it's a low-end box.
net.core.default_qdisc = fq_codel

# Let unprivileged user namespaces work (Wine, sandboxing helpers).
kernel.unprivileged_userns_clone = 1

# Fewer inotify watches than a dev box needs, plenty for a file manager.
fs.inotify.max_user_watches = 65536
